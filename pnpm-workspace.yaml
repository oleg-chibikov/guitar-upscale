packages:
  # include packages in subfolders (e.g. apps/ and packages/)
  - "apps/**"
  - "packages/**"
  # if required, exclude some directories
  - "!**/test/**"
allowBuilds:
  "@parcel/watcher": false
  "@vercel/speed-insights": false
  midi-writer-js: false
  unrs-resolver: false
ignore-workspace-root-check: true
