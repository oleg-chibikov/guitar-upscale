name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --check .

      - run: pnpm exec eslint .

      - run: pnpm exec jest

      # Static export rejects API routes, and the Pages copy runs with auth off.
      - run: rm -rf src/pages/api

      - id: pages
        uses: actions/configure-pages@v6

      # next build also runs the type check.
      - run: pnpm exec next build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Songsterr allows no browser requests, so Pages searches through the Vercel copy.
          NEXT_PUBLIC_SONGSTERR_API_HOST: https://guitar-upscale.vercel.app

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Merges Dependabot PRs once the build passes, majors included.
  automerge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh pr merge "${{ github.event.pull_request.html_url }}" --squash --delete-branch

      # A merge made with GITHUB_TOKEN doesn't start the push workflow, so deploy by hand.
      - run: gh workflow run ci.yml --ref main
